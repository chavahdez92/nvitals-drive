name: Error
description: Algo no funciona como debería.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
      description: Describe el problema y lo que esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Conecta el disco…
        2. Abre la pestaña…
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Versión del sistema
      placeholder: macOS 27.0 · Windows 11 24H2 · Ubuntu 24.04
  - type: input
    id: app-version
    attributes:
      label: Versión de NVitals Drive
      description: Ajustes → Acerca de.
    validations:
      required: true
  - type: input
    id: smartctl
    attributes:
      label: Versión de smartctl
      description: Primera línea de `smartctl --version`.
  - type: textarea
    id: logs
    attributes:
      label: Registros o capturas
      description: Si adjuntas salidas de smartctl, borra antes el número de serie.
      render: text
