# cargo-deny: licencias, avisos de seguridad y origen de las dependencias.
# Uso: `cargo deny check` (en CI, job `deny`).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Solo los crates que usamos directamente: los avisos de «sin mantenimiento» en dependencias
# indirectas de Tauri (unic-*, proc-macro-error, vía gtk/glib) no tienen arreglo de nuestro lado.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
