[package]
name = "healthdiskinfo"
version = "1.0.0"
description = "NVitals Drive: diagnóstico de salud de SSD NVMe con smartctl"
authors = ["Salvador Hernández"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chavahdez92/nvitals-drive"
edition = "2021"
rust-version = "1.80"

[lib]
name = "healthdiskinfo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt-multi-thread", "fs"] }
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
log = "0.4"
regex = "1"
libc = "0.2"
lopdf = "0.42"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSGeometry", "NSObject", "NSData", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder", "NSWindow", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKPDFConfiguration", "WKSnapshotConfiguration", "objc2-app-kit", "objc2-core-foundation", "block2"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

